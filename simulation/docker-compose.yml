version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ais-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ais-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  ais-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ais-simulator
    depends_on:
      - kafka
    ports:
      - "8091:8091"
    environment:
      APP_HTTP_ADDR: ":8091"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_ENABLED: "true"
      ORDER_TOPIC: "ais.orders.v1"
      EXECUTOR_TOPIC: "ais.executors.v1"
      ASSIGNMENT_DELAY_MIN: "2s"
      ASSIGNMENT_DELAY_MAX: "10s"
      DATABASE_URL: "sqlite+aiosqlite:///./ais.db"
    volumes:
      - ais-data:/app

volumes:
  ais-data:
