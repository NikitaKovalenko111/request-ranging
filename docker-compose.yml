services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: executor_balancer
      POSTGRES_USER: executor_balancer
      POSTGRES_PASSWORD: executor_balancer
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U executor_balancer -d executor_balancer"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data

  ais-simulator:
    build:
      context: ./simulation
    environment:
      APP_HTTP_ADDR: ":8091"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_ENABLED: "true"
      ORDER_TOPIC: "ais.orders.v1"
      EXECUTOR_TOPIC: "ais.executors.v1"
      ASSIGNMENT_DELAY_MIN: "2s"
      ASSIGNMENT_DELAY_MAX: "10s"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/ais.db"
    ports:
      - "8091:8091"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ais-data:/app/data

  executor-balancer:
    build:
      context: ./backend
    environment:
      APP_HTTP_ADDR: ":8090"
      LOG_LEVEL: "info"
      POSTGRES_DSN: "postgres://executor_balancer:executor_balancer@postgres:5432/executor_balancer?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CONSUMER_GROUP: "executor-balancer-v1"
      KAFKA_ORDER_TOPIC: "ais.orders.v1"
      KAFKA_EXECUTOR_TOPIC: "ais.executors.v1"
      KAFKA_DECISION_RESULT_TOPIC: "decision.result.v1"
      KAFKA_DEAD_LETTER_TOPIC: "executor-balancer.dead-letter.v1"
      AIS_BASE_URL: "http://ais-simulator:8091"
      AIS_REQUEST_TIMEOUT: "12s"
      RESERVATION_TTL: "30s"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ais-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  decision-engine:
    build:
      context: ./decision-engine
    environment:
      LOG_LEVEL: "INFO"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_ORDER_TOPIC: "ais.orders.v1"
      KAFKA_DECISION_RESULT_TOPIC: "decision.result.v1"
      KAFKA_DLQ_TOPIC: "decision-engine.dead-letter.v1"
      KAFKA_CONSUMER_GROUP: "decision-engine-v1"
      KAFKA_CLIENT_ID: "decision-engine"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_ACTIVE_SET_KEY: "executors:active"
      REDIS_EXECUTOR_KEY_PREFIX: "executor:"
      REDIS_RULES_KEY: "rules:active"
      FEATURE_EXTRACTOR_MODE: "ml"
      FEATURE_EXTRACTOR_DEVICE: "cpu"
      MODEL_ROOT: "/app/models"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      executor-balancer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ais-data:
  kafka-data:
  postgres-data:
  redis-data:

